<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>États UI &amp; Network approfondi</title>
  <script src="scripts.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    button { margin: 0.5rem 0.5rem 0.5rem 0; padding: 0.4rem 0.8rem; font-size: 1rem; }
    #status {
      margin: 1rem 0;
      padding: 0.6rem 0.8rem;
      min-height: 1.5rem;
      border-radius: 4px;
      font-weight: 500;
    }
    #status[data-state="loading"] { background: #fff3cd; color: #856404; }
    #status[data-state="success"] { background: #d4edda; color: #155724; }
    #status[data-state="error"]   { background: #f8d7da; color: #721c24; }
    #project-list { margin-top: 1rem; padding-left: 1.2rem; }
    #project-list li { margin: 0.4rem 0; }
    a { color: #06c; }
    .hint { font-size: 0.9rem; color: #666; margin-top: 1.5rem; }
  </style>
</head>
<body>
  <h1>Section 04 – États UI &amp; Network</h1>
  <p>Ouvrez les DevTools → onglet <strong>Network</strong> avant chaque essai.</p>

  <button id="btn-load">Charger les projets</button>
  <button id="btn-clear">Vider</button>

  <div id="status" data-state="">Prêt</div>
  <ul id="project-list"></ul>

  <p class="hint">
    Tests obligatoires :<br>
    1. Cas normal<br>
    2. URL volontairement fausse (404)<br>
    3. Offline (Network → Offline)<br>
    4. Slow 3G + observation du loading
  </p>
</body>
</html>
