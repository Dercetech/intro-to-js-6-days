<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Réacteur 4 – Division interdite</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #071109;
      color: #f4f7e8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem; }
    main { width: min(860px, 100%); display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 0.9fr); overflow: hidden; border: 1px solid #426c30; border-radius: 18px; background: #101c13; box-shadow: 0 24px 70px #000a; }
    .control-panel { padding: clamp(1.5rem, 4vw, 3rem); }
    .eyebrow { margin: 0 0 0.5rem; color: #a8df63; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
    h1 { margin: 0 0 0.75rem; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 0.95; }
    .intro { color: #c8d0c4; line-height: 1.55; }
    form { display: grid; gap: 1rem; margin-top: 2rem; }
    .numbers { display: grid; grid-template-columns: 1fr auto 1fr; gap: 0.75rem; align-items: end; }
    label { display: grid; gap: 0.35rem; font-weight: 700; }
    input { width: 100%; padding: 0.75rem; border: 1px solid #55725b; border-radius: 8px; background: #071109; color: inherit; font: inherit; }
    .operator { padding-bottom: 0.75rem; font-size: 1.5rem; }
    button { padding: 0.85rem 1rem; border: 0; border-radius: 8px; background: #b7ef52; color: #101909; font: inherit; font-weight: 900; cursor: pointer; }
    button:hover { background: #d0ff78; }
    #result { min-height: 3.5rem; margin: 1.25rem 0 0; padding: 1rem; border-left: 4px solid #b7ef52; background: #071109; font-family: ui-monospace, monospace; }
    .reactor { position: relative; display: grid; place-items: end center; min-height: 560px; padding: 1.5rem; overflow: hidden; background: radial-gradient(circle at 50% 42%, #50ff4f55, transparent 30%), linear-gradient(#122118, #071109); }
    .reactor::before { content: ""; position: absolute; inset: 8% 14%; border: 2px solid #b7ef5240; border-radius: 50%; box-shadow: 0 0 45px #60ff6030; }
    .reactor img { position: relative; z-index: 1; width: min(100%, 380px); height: 500px; object-fit: contain; filter: drop-shadow(0 16px 22px #000a); transition: filter 160ms ease; }
    .reactor.meltdown { background: radial-gradient(circle at 50% 58%, #d9ff00aa, transparent 36%), linear-gradient(#261b08, #0b1006); }
    .reactor.meltdown img { filter: drop-shadow(0 0 24px #d9ff00aa); }
    .reactor-status { position: absolute; z-index: 2; top: 1.25rem; left: 1.25rem; margin: 0; padding: 0.45rem 0.7rem; border-radius: 999px; background: #071109dd; color: #b7ef52; font: 800 0.82rem ui-monospace, monospace; text-transform: uppercase; }
    @media (max-width: 720px) {
      main { grid-template-columns: 1fr; }
      .reactor { min-height: 420px; }
      .reactor img { height: 380px; }
    }
  </style>
</head>
<body>
  <main>
    <section class="control-panel">
      <p class="eyebrow">Réacteur 4</p>
      <h1>Division interdite</h1>
      <p class="intro">Entrez deux nombres. Le calcul est banal. Le diviseur zéro l’est nettement moins pour l’écureuil.</p>

      <form id="division-form">
        <div class="numbers">
          <label>Dividende
            <input id="dividend" type="number" value="24" step="any" required>
          </label>
          <span class="operator" aria-hidden="true">÷</span>
          <label>Diviseur
            <input id="divisor" type="number" value="6" step="any" required>
          </label>
        </div>
        <button type="submit">Lancer le calcul</button>
      </form>

      <p id="result" aria-live="polite">Réacteur stable. Essayez 24 ÷ 6.</p>
    </section>

    <section class="reactor" id="reactor" aria-label="État du réacteur">
      <p class="reactor-status" id="reactor-status">Stable</p>
      <img id="squirrel" src="./assets/reactor-squirrel-safe.png" alt="L’écureuil vert du Réacteur 4 est sain et sauf.">
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
