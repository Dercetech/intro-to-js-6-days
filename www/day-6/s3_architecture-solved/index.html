<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Architecture légère – Compteur</title>
  <script type="module" src="main.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    #value { font-size: 3rem; font-weight: 700; margin: 1rem 0; }
    #history { font-family: monospace; background: #f4f4f4; padding: 0.75rem; min-height: 2.5rem; margin: 1rem 0; word-break: break-all; }
    button { margin: 0.35rem 0.35rem 0.35rem 0; padding: 0.5rem 1rem; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Compteur avec historique</h1>
  <p>Ouvrez Sources et Console (F12). Travaillez dans les fichiers .js.</p>

  <div id="value">0</div>
  <div id="history"></div>

  <button id="btn-inc">+1</button>
  <button id="btn-dec">-1</button>
  <button id="btn-reset">Reset</button>
</body>
</html>
