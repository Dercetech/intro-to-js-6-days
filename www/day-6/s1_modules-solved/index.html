<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Modules ES – Calculateur TTC</title>
  <script type="module" src="main.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: 1rem 0 0.25rem; }
    input { font-size: 1rem; padding: 0.4rem 0.6rem; width: 100%; max-width: 200px; }
    button { margin-top: 1.25rem; padding: 0.5rem 1.2rem; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 1.5rem; padding: 1rem; background: #f4f4f4; min-height: 3rem; font-size: 1.25rem; }
  </style>
</head>
<body>
  <h1>Calculateur TTC</h1>
  <p>Ouvrez la Console, Sources et Network (F12). Travaillez dans les fichiers .js.</p>

  <label>Prix HT (€)
    <input type="number" id="price-ht" value="100" step="0.01">
  </label>

  <label>Taux de TVA
    <input type="number" id="rate" value="0.20" step="0.01" min="0" max="1">
  </label>

  <button id="btn-calc">Calculer</button>

  <div id="result">Le total TTC apparaîtra ici.</div>
</body>
</html>
