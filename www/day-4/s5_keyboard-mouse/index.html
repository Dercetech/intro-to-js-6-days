<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keyboard &amp; mouse essentials</title>
  <script src="scripts.js" defer></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    .zone {
      border: 2px solid #333;
      padding: 1.5rem;
      margin: 1rem 0;
      min-height: 80px;
      background: #f9f9f9;
      user-select: none;
    }
    #draw-area {
      height: 180px;
      position: relative;
      cursor: crosshair;
    }
    input { padding: 0.4rem 0.6rem; font-size: 1rem; width: 100%; box-sizing: border-box; margin-top: 0.3rem; }
    #log {
      margin-top: 1.5rem;
      padding: 1rem;
      background: #f4f4f4;
      min-height: 6rem;
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 0.9rem;
    }
    .hint { font-size: 0.85rem; color: #555; }
  </style>
</head>
<body>
  <h1>Section 05 – Keyboard &amp; mouse</h1>
  <p>Ouvrez la Console (F12). Travaillez dans scripts.js.</p>

  <label>
    Champ texte (test clavier)
    <input type="text" id="key-field" placeholder="Tapez ici…">
  </label>
  <p class="hint">Essayez Enter, Escape, et des lettres.</p>

  <div class="zone" id="click-zone">
    Zone de clic – cliquez ici (test click / mousedown / mouseup)
  </div>

  <div class="zone" id="draw-area">
    Zone de position – bougez la souris et cliquez (clientX / offsetX)
  </div>

  <div id="log">Log…</div>
</body>
</html>
