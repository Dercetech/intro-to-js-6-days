<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Le bouton qui fuit</title>
  <script src="scripts.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, sans-serif;
      overflow: hidden;
      background: #f0f0f0;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #fugitive {
      position: absolute;
      padding: 0.7rem 1.2rem;
      font-size: 1.1rem;
      cursor: pointer;
      border: 2px solid #333;
      background: #fff;
      border-radius: 6px;
      user-select: none;
      transition: left 0.12s ease, top 0.12s ease;
    }
    #message {
      position: absolute;
      top: 1rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.95rem;
      color: #555;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="stage">
    <p id="message">Approchez la souris… le bouton n’aime pas ça.</p>
    <button id="fugitive" type="button">click me</button>
  </div>
</body>
</html>
